name: dashboard
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  dio: ^5.8.0+1
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  go_router: ^16.0.0
  flutter_screenutil: ^5.9.3
  fluid_kit: ^3.0.0
  pinput: ^5.0.1
  easy_localization: ^3.0.7+1
  flutter_svg: ^2.2.0
  get_it: ^8.0.3
  get_storage: ^2.1.1
  cached_network_image: ^3.4.1
  carousel_slider_plus: ^7.1.1
  fl_chart: ^1.0.0
  # flutter_expandable_table: ^2.1.0
  material_table_view: ^5.5.0
  pie_chart: ^5.4.0
  easy_pie_chart: ^1.0.2


dependency_overrides:
  characters: ^1.4.1
  material_color_utilities: ^0.13.0
  meta: ^1.17.0
  petitparser: ^7.0.0
  vector_math: ^2.2.0
  xml: ^6.6.0
  leak_tracker: ^11.0.1
  leak_tracker_flutter_testing: ^3.0.10
  leak_tracker_testing: ^3.0.2
  test_api: ^0.7.6
  vm_service: ^15.0.2
  web: ^1.1.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/svg/
    - assets/translations/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter_18pt-Thin.ttf
          weight: 100
        - asset: fonts/Inter_18pt-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: fonts/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: fonts/Inter_18pt-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: fonts/Inter_18pt-LightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: fonts/Inter_18pt-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: fonts/Inter_18pt-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter_18pt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: fonts/Inter_18pt-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: fonts/Inter_18pt-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: fonts/Inter_18pt-Black.ttf
          weight: 900
        - asset: fonts/Inter_18pt-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: fonts/Inter_24pt-Regular.ttf
          weight: 400
        - asset: fonts/Inter_24pt-Bold.ttf
          weight: 700